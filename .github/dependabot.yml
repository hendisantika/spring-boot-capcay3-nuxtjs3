# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # Backend: Spring Boot (Maven)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
        update-types:
          - "minor"
          - "patch"
      maven-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot*"
        update-types:
          - "minor"
          - "patch"

  # Frontend: Nuxt 3 (pnpm lockfile is handled by the npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: "scope"
    groups:
      nuxt-vue:
        patterns:
          - "nuxt"
          - "vue"
          - "@nuxt/*"
          - "@vue/*"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "nuxt"
          - "vue"
          - "@nuxt/*"
          - "@vue/*"
        update-types:
          - "minor"
          - "patch"

  # CI: GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
