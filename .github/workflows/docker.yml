# Builds the backend and frontend Docker images and runs a docker compose smoke test.
# Images are NOT pushed anywhere; this workflow only checks that the Dockerfiles still work.

name: Docker CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "pom.xml"
      - ".mvn/**"
      - "src/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "pom.xml"
      - ".mvn/**"
      - "src/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
          - service: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          tags: spring-boot-capcay3-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke-test:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Start services and wait until healthy
        env:
          GOOGLE_RECAPTCHA_SECRET: ci-dummy-secret
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Check backend
        run: |
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          # Without a valid reCAPTCHA token the filter answers 400 -> the filter works
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/login)
          echo "POST /api/login -> HTTP $code"
          test "$code" = "400"

      - name: Check frontend
        run: curl -fsS http://localhost:3000 | grep -q 'placeholder="Email"' && echo "frontend OK"

      - name: Show logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
