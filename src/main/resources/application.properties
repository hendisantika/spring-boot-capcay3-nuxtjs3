spring.application.name=spring-boot-capcay3-nuxtjs3
# Load local secrets from ./.env if it exists (copy .env.example to .env)
spring.config.import=optional:file:.env[.properties]
# Google reCAPTCHA v3 secret key (never commit the real value)
google.recaptcha.secret=${GOOGLE_RECAPTCHA_SECRET:}
# Actuator: expose only the health endpoint (used by the Docker healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
