# Run both apps: docker compose up --build
#   Backend  -> http://localhost:8080
#   Frontend -> http://localhost:3000
# Secrets come from .env (backend) and frontend/.env (frontend); see the .env.example files.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: spring-boot-capcay3-backend:latest
    container_name: capcay3-backend
    env_file:
      - path: .env
        required: false
    environment:
      GOOGLE_RECAPTCHA_SECRET: ${GOOGLE_RECAPTCHA_SECRET:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: spring-boot-capcay3-frontend:latest
    container_name: capcay3-frontend
    env_file:
      - path: frontend/.env
        required: false
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
